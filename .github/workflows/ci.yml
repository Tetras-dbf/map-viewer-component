# mirador isn't published to npm yet (Tetras-dbf/mirador#1 is open), so this
# package depends on it via a local "file:../mirador" path. To make that
# resolve on a CI runner (which only checks out this repo by default), every
# job here also checks out Tetras-dbf/mirador into a sibling directory and
# installs its dependencies before installing this package's.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: map-viewer-component
      - uses: actions/checkout@v7
        with:
          repository: Tetras-dbf/mirador
          path: mirador
      - uses: actions/setup-node@v7
        with:
          node-version-file: map-viewer-component/.nvmrc
      - run: npm ci
        working-directory: mirador
      - run: npm ci
        working-directory: map-viewer-component
      - run: npm run lint
        working-directory: map-viewer-component

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: map-viewer-component
      - uses: actions/checkout@v7
        with:
          repository: Tetras-dbf/mirador
          path: mirador
      - uses: actions/setup-node@v7
        with:
          node-version-file: map-viewer-component/.nvmrc
      - run: npm ci
        working-directory: mirador
      - run: npm ci
        working-directory: map-viewer-component
      - run: npm test
        working-directory: map-viewer-component

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: map-viewer-component
      - uses: actions/checkout@v7
        with:
          repository: Tetras-dbf/mirador
          path: mirador
      - uses: actions/setup-node@v7
        with:
          node-version-file: map-viewer-component/.nvmrc
      - run: npm ci
        working-directory: mirador
      - run: npm ci
        working-directory: map-viewer-component
      - run: npm run build
        working-directory: map-viewer-component
